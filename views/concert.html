<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#110811"><title>La sorpresa: Álvaro Díaz</title><link rel="stylesheet" href="../public/css/style-alvarodiaz.css"></head>
<body class="neon-page"><main class="concert-shell"><header class="concert-hero"><p class="neon-kicker">sorpresa desbloqueada</p><h1>Nos vamos a ver a<br><span data-model="concert.artist">Álvaro Díaz</span></h1><p class="concert-hero__sub">Una noche para perder la voz juntos.</p></header><article class="neon-letter" data-letter="concert"><p class="neon-letter__tag">SIDE A · PARA NOSOTROS</p><h2 data-letter-title></h2><div data-letter-body></div></article><section class="ticket-area" aria-labelledby="ticket-title"><p class="neon-kicker">tu pase para el recuerdo</p><h2 id="ticket-title">Las entradas</h2><div class="ticket-stack"><article class="concert-ticket"><div class="concert-ticket__top"><span>ADMIT ONE</span><span>✦</span></div><p class="concert-ticket__artist" data-model="concert.artist"></p><p class="concert-ticket__tour" data-model="concert.tour"></p><div class="concert-ticket__info"><p><strong>LUGAR</strong><span data-model="concert.venue"></span></p><p><strong>CIUDAD</strong><span data-model="concert.city"></span></p><p><strong>FECHA</strong><span data-model="concert.date"></span></p><p><strong>HORA</strong><span data-model="concert.time"></span></p></div><div class="barcode" aria-label="Código de barras decorativo"></div><small data-model="concert.admission"></small></article><p class="ticket-note">Personaliza lugar, ciudad y fecha en <code>models/anniversaryModel.js</code>.</p></div></section><button class="neon-button" data-go="future-pages.html">Abrir nuestra libreta futura →</button></main><script src="../models/anniversaryModel.js"></script><script src="../controllers/pageController.js"></script><script src="../public/js/app.js"></script></body></html>
